<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Itinera - Itinerary</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body class="itinerary-page">

  <header>
    <h1>Itinerary</h1>
    <p>Plan your trip activities and dates!</p>
  </header>

  <!-- Navigation below header -->
  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="destinations.html">Destinations</a>
    <a href="packing.html">Packing List</a>
    <a href="expenses.html">Expenses</a>
  </nav>

  <section class="card">
    <h2>Add Activity</h2>

    <div class="input-row">
      <input type="text" id="activityInput" placeholder="Activity name">
      <input type="text" id="activityAddressInput" placeholder="Address (optional)">
      <input type="datetime-local" id="dateInput">
      <button onclick="addActivity()">Add</button>
    </div>

    <ol id="activityList">
      <!-- Activities will appear here -->
    </ol>
  </section>

  <section class="card">
    <h2>Calendar View</h2>
    <div class="trip-length-presets" aria-label="Quick trip length options">
      <button type="button" class="trip-preset-btn" data-days="3">3 Days</button>
      <button type="button" class="trip-preset-btn" data-days="7">7 Days</button>
      <button type="button" class="trip-preset-btn" data-days="14">14 Days</button>
      <button type="button" class="trip-preset-btn" data-days="30">30 Days</button>
    </div>
    <div class="input-row">
      <input type="date" id="tripStartDateInput" aria-label="Trip start date">
      <input type="number" id="tripLengthInput" min="1" max="365" placeholder="Trip length (days)" aria-label="Trip length in days">
    </div>
    <div class="trip-range-apply-wrap">
      <button type="button" id="applyTripRangeBtn">Apply Trip Length</button>
      <select id="destinationSyncSelect" aria-label="Select destination to sync dates from"></select>
      <button type="button" id="syncDestinationDatesBtn">Use Destination Dates</button>
    </div>
    <p id="tripRangeSourceText" class="trip-range-source">Using saved trip settings.</p>
    <div id='calendar'></div>
  </section>

  <section class="card">
    <h2>View By Day</h2>
    <div class="input-row day-view-controls">
      <button type="button" id="dayViewPrevBtn">Previous Day</button>
      <input type="date" id="dayViewDateInput" aria-label="Choose date to view activities">
      <button type="button" id="dayViewTodayBtn">Today</button>
      <button type="button" id="dayViewNextBtn">Next Day</button>
    </div>
    <p id="dayViewSummaryText" class="trip-range-source">Select a date to view scheduled activities.</p>
    <ul id="dayViewList"></ul>
  </section>

  <script src="script.js"></script>

  <!-- Link the external JavaScript file -->
  <script src="itinerary.js"></script>

</body>
</html>
