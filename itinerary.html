<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Itinera - Itinerary</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body class="itinerary-page">

  <a class="brand-mark" href="index.html" aria-label="Go to Itinera home page">Itinera</a>

  <header>
    <h1>Itinerary</h1>
    <p>Plan your trip activities and dates!</p>
  </header>

  <!-- Navigation below header -->
  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="destinations.html">Destinations</a>
    <a href="packing.html">Packing List</a>
    <a href="expenses.html">Expenses</a>
    <a href="conversion.html">Conversion Rates</a>
  </nav>

  <section class="card">
    <h2>Add Activity</h2>

    <div class="input-row">
      <input type="text" id="activityInput" placeholder="Activity name">
      <input type="text" id="activityAddressInput" placeholder="Address (optional)">
      <input type="datetime-local" id="dateInput">
      <button onclick="addActivity()">Add</button>
    </div>

    <ol id="activityList">
      <!-- Activities will appear here -->
    </ol>
  </section>

  <section class="card">
    <h2>Calendar View</h2>
    <div class="trip-range-apply-wrap">
      <select id="destinationSyncSelect" aria-label="Select destination to sync dates from"></select>
      <button type="button" id="syncDestinationDatesBtn">Use Destination Dates</button>
    </div>
    <p class="quick-destination-title" id="quickDestinationTitle">No destinations yet? Add one here.</p>
    <div class="input-row quick-destination-wrap" id="quickDestinationWrap">
      <input type="text" id="quickDestinationNameInput" placeholder="Destination name" aria-label="Destination name">
      <input type="date" id="quickDestinationStartInput" aria-label="Destination start date">
      <input type="date" id="quickDestinationEndInput" aria-label="Destination end date">
      <button type="button" id="quickAddDestinationBtn">Add Destination</button>
    </div>
    <p id="tripRangeSourceText" class="trip-range-source">Select a destination, then click Use Destination Dates.</p>
    <div id='calendar'></div>
  </section>

  <section class="card">
    <h2>View By Day</h2>
    <div class="input-row day-view-controls">
      <button type="button" id="dayViewPrevBtn">Previous Day</button>
      <input type="date" id="dayViewDateInput" aria-label="Choose date to view activities">
      <button type="button" id="dayViewTodayBtn">Today</button>
      <button type="button" id="dayViewNextBtn">Next Day</button>
    </div>
    <p id="dayViewSummaryText" class="trip-range-source">Select a date to view scheduled activities.</p>
    <ul id="dayViewList"></ul>
  </section>

  <script src="script.js"></script>

  <!-- Link the external JavaScript file -->
  <script src="itinerary.js"></script>

</body>
</html>
