<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Itinera - Packing List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="packing-page">

  <a class="brand-mark" href="index.html" aria-label="Go to Itinera home page">Itinera</a>

  <header>
    <h1>Packing List</h1>
    <p>Keep track of what to bring on your trip!</p>
  </header>

  <!-- Navigation below header -->
  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="itinerary.html">Itinerary</a>
    <a href="destinations.html">Destinations</a>
    <a href="expenses.html">Expenses</a>
    <a href="conversion.html">Conversion Rates</a>
  </nav>

  <section class="card">
    <h2>Add Item</h2>

    <!-- Input and Add button -->
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="Packing item">
      <button onclick="addItem()">Add</button>
    </div>

    <!-- Packing list -->
    <ul id="packingList">
      <!-- Items will appear here -->
    </ul>
  </section>

  <section class="card packing-suggestions-card">
    <h2>Packing Suggestions</h2>
    <p id="suggestionSourceText">Suggestions appear after you add a destination.</p>
    <div class="suggestion-actions">
      <button type="button" id="addAllSuggestionsBtn">Add All Suggestions</button>
    </div>
    <ul id="suggestionList">
      <!-- Destination-aware suggestions appear here -->
    </ul>
  </section>

  <script src="script.js"></script>

  <!-- Link external JavaScript -->
  <script src="packing.js"></script>

</body>
</html>
